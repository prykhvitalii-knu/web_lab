services:
  akatosh-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akatosh_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:?set_POSTGRES_USER}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD}@akatosh-db:5432/akatosh_db
      - REDIS_URL=redis://akatosh-redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:?set_RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS:?set_RABBITMQ_DEFAULT_PASS}@akatosh-rabbitmq:5672//
      - FEATURE_ADMIN_TOKEN=${FEATURE_ADMIN_TOKEN:-}
      - SECRET_KEY=${SECRET_KEY:?set_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - SESSION_HTTPS_ONLY=${SESSION_HTTPS_ONLY:-false}
      - GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-}
      - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      akatosh-db:
        condition: service_healthy
      akatosh-redis:
        condition: service_healthy
      akatosh-rabbitmq:
        condition: service_healthy
    restart: always

  akatosh-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akatosh_worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    healthcheck:
      disable: true
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:?set_POSTGRES_USER}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD}@akatosh-db:5432/akatosh_db
      - REDIS_URL=redis://akatosh-redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER:?set_RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS:?set_RABBITMQ_DEFAULT_PASS}@akatosh-rabbitmq:5672//
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      akatosh-rabbitmq:
        condition: service_healthy
    restart: always

  akatosh-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akatosh_mcp
    command: ["python", "-m", "app.mcp_server"]
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:?set_POSTGRES_USER}:${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD}@akatosh-db:5432/akatosh_db
      - MCP_TENANT_ID=${MCP_TENANT_ID:?set_MCP_TENANT_ID}
    profiles: ["mcp"]
    stdin_open: true
    tty: true
    depends_on:
      akatosh-db:
        condition: service_healthy

  akatosh-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: akatosh_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?set_RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?set_RABBITMQ_DEFAULT_PASS}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  akatosh-db:
    image: postgres:15-alpine
    container_name: akatosh_db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set_POSTGRES_PASSWORD}"
      POSTGRES_DB: akatosh_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_akatosh_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d akatosh_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  akatosh-redis:
    image: redis:7-alpine
    container_name: akatosh_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_akatosh_data:
